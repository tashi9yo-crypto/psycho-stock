[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psycho-stock"
version = "0.1.0"
description = "군중심리로 주식시장을 읽고 예측하는 시스템"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
psycho-stock = "psycho_stock.cli:main"

[tool.setuptools]
packages = ["psycho_stock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
